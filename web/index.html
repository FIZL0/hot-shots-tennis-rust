<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Hot Shots Tennis</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 16px system-ui, sans-serif;
    overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-touch-callout: none;
    /* B113: a drag on the touch stick / canvas never selects, highlights or magnifies (iOS home-screen app) */
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  /* B256: user-select, the callout and touch-action aren't all inherited, so every element (the boot/ISO text, the
     full-screen code input's surroundings, pseudo-elements) gets them itself */
  *, *::before, *::after { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
  /* iOS won't type into an input under a user-select: none parent; the token paste / join code keep their own taps */
  input, textarea { user-select: text; -webkit-user-select: text; -webkit-touch-callout: default; touch-action: manipulation; }
  #disc { max-width: 32em; margin: 0 auto; padding: 2em 16px; }
  /* B333: the page and the canvas are as big as the visible screen right now (--app-w/-h, kept up to date below), not
     a size read once on load: iOS Safari can open with its toolbar's height still unsettled and leave an empty bar
     ("chin") until the phone is turned. 100dvh before the script runs. The canvas is pinned to the top left so a
     page scrolled by the browser can't shift it. */
  html, body { width: var(--app-w, 100%); height: 100%; height: var(--app-h, 100dvh); }
  /* B314: the canvas starts below the top safe area (the iPhone's Dynamic Island / status bar, which the home-screen
     app blurs over): the game's view is that much shorter, so neither the far side's score nor a menu's top is drawn
     under it. 0 everywhere else (landscape, desktop, Safari with its own bar). */
  :root { --safe-top: env(safe-area-inset-top, 0px); }
  canvas { touch-action: none; display: block; position: fixed; left: 0; top: var(--safe-top);
    width: var(--app-w, 100vw) !important; height: calc(var(--app-h, 100dvh) - var(--safe-top)) !important; }
  button { font: inherit; }
  /* Join by Code on a touch screen: a tap anywhere but the controls opens the keyboard (typed_code) */
  #codekeys { position: fixed; inset: 0; z-index: 5; opacity: 0; font-size: 16px; border: 0; padding: 0; caret-color: transparent; }
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: .6em; padding: 16px; text-align: center; pointer-events: none; }
  #boot[hidden] { display: none; }
  #boot.err, #boot.slow { pointer-events: auto; background: #000; }
  /* a stop is over everything (the touch pad hides then, touch.js), its links big enough to tap */
  #boot.err { z-index: 30; }
  #boot.err #help a { display: inline-block; padding: .5em .9em; margin: .2em; border: 1px solid #8cf6; border-radius: .4em; }
  /* the rule above would show a hidden link (Try WebGL2 on the WebGL2 build) */
  #boot.err #help a[hidden] { display: none; }
  /* and the dot before a hidden link */
  #help span:has(+ a[hidden]) { display: none; }
  #boot.err #step { color: #f88; white-space: pre-wrap; max-width: 40em; overflow-wrap: anywhere; max-height: 60vh; overflow-y: auto; }
  #boot a { color: #8cf; }
  /* M16: the Mods screen's Add mod row (web.rs mod_picker): a tap on it is the file input's own */
  #modzip { position: fixed; z-index: 5; opacity: 0; cursor: pointer; }
  /* B298: Firefox/Zen notice, a tap closes it */
  #gecko { position: fixed; top: 0; left: 0; right: 0; z-index: 40; padding: .6em 16px; background: #333e; color: #fff;
    text-align: center; font-size: 14px; cursor: pointer; }
</style>

<body>
<input id="modzip" type="file" accept=".zip,application/zip" hidden aria-label="Add mod">
<input id="codekeys" hidden autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done" aria-label="Lobby code">
<div id="disc" hidden>
  <p>Pick your own <b>Hot Shots Tennis (USA)</b> disc image (SCUS-97610). The game copies what it needs (≈ 170 MB)
     into this browser's storage once; the ISO isn't needed after that.</p>
  <input id="iso" type="file" accept=".iso">
  <p id="status"></p>
</div>
<!-- what the page is doing until the game draws (web.rs `shown`), or why it stopped -->
<div id="boot"><div id="step">Loading…</div><div id="help" hidden>
  <a href="">Reload</a><span> · </span><a id="gl" href="?webgl2">Try WebGL2</a><span> · </span><a href="?forget">Pick the ISO again</a><span> · </span><a id="copy" href="" hidden>Copy the error</a></div></div>
<script>
// A LAN answer's link (M2k, `net/rtc.rs`), opened by the host scanning a guest's screen: hand it to the game's tab
// and stop here (the game isn't loaded twice).
const answer = new URLSearchParams(location.search).get('code')?.startsWith('rtca');
if (answer) {
  new BroadcastChannel('hst-rtc').postMessage(new URLSearchParams(location.search).get('code'));
  document.body.textContent = 'Sent to the game in your other tab: switch back to it. You can close this one.';
}
</script>
<script>
// B333: the visible screen's size into --app-w/-h, scrolled back to the top, whenever it may have changed: a resize, a
// turn, the toolbar settling (visualViewport), the page shown again; and a few times in the first seconds and after a
// turn, as iOS reports the settled size late without a resize. innerWidth/innerHeight, not the visual viewport's: an
// open keyboard (Join by Code) shrinks the visual viewport and must not shrink the game.
{
  const root = document.documentElement.style;
  const fit = () => {
    if (innerWidth > 0 && innerHeight > 0) {
      root.setProperty('--app-w', innerWidth + 'px');
      root.setProperty('--app-h', innerHeight + 'px');
    }
    if (scrollX || scrollY) scrollTo(0, 0);
  };
  const settle = () => { fit(); for (const ms of [50, 150, 400, 1000, 2000]) setTimeout(fit, ms); };
  for (const e of ['resize', 'pageshow', 'load', 'focus']) addEventListener(e, fit);
  addEventListener('orientationchange', settle);
  screen.orientation?.addEventListener?.('change', settle);
  visualViewport?.addEventListener('resize', fit);
  document.addEventListener('visibilitychange', () => document.hidden || settle());
  settle();
}
</script>
<script>
// Boot status and errors on the page instead of a silent black screen. A Rust panic logs its message with
// console.error (Bevy's panic hook) before the wasm traps: the last such line is what the error shows.
const boot = document.getElementById('boot'), step = document.getElementById('step');

// and offers the Reload / WebGL2 / ISO links; the next step takes them away again.
let stuck;
const say = t => {
  if (boot.classList.contains('err')) return;
  step.textContent = t;
  boot.classList.remove('slow');
  document.getElementById('help').hidden = true;
  clearTimeout(stuck);
  stuck = setTimeout(() => {
    if (boot.hidden || boot.classList.contains('err')) return;
    console.warn(`hst: no progress for 30 s at "${t}"`);
    step.textContent = `${t} No progress for 30 s: the browser may have stalled here. Reload usually gets past it.`;
    boot.classList.add('slow');
    document.getElementById('help').hidden = false;

};
let lastError = '';
const error = console.error;
console.error = (...a) => { lastError = a.map(String).join(' '); error.apply(console, a); };
function fail(e) {
  if (boot.classList.contains('err')) return;
  const msg = String(e?.message ?? e ?? 'unknown error');
  // winit hands the event loop to the browser by throwing: not an error
  if (msg.includes('Using exceptions for control flow')) return;
  // B244: a WebGPU validation error mid-game (an iPhone's "createBindGroup" after a hit; its WebGL2 build plays on)
  // kills the match: start again on the WebGL2 build, the browser's message kept in the console for a report
  if (/createBindGroup|Validation/.test(`${lastError} ${msg} ${renderError}`) && window.hstWebGL2?.(`${lastError || msg}`)) return;
  // B378: a panic on the WebGPU build before its first frame (its renderer couldn't start) gets the WebGL2 build too
  if (!shown && /panicked/.test(lastError) && window.hstWebGL2?.(lastError.split('\n').slice(0, 2).join(' '))) return;
  boot.hidden = false;
  boot.classList.add('err');
  document.getElementById('help').hidden = false;
  // the panic's file:line and message only: its stacks (wasm-function[N], unreadable in a stripped build) pushed them
  // off a phone's screen; the whole text stays in the console
  // B378: a dependency's panic names its file under the build machine's cargo registry
  // (/home/runner/.cargo/registry/src/index.crates.io-<hash>/), which pushed the message itself out of a short report:
  // the crate and file are enough
  const why = (/panicked/.test(lastError) ? lastError : msg).split(/\n\s*Stack:/)[0].replace(/\S*\/\.cargo\/registry\/src\/[^/\s]+\//g, '');
  const text = why.split('\n').filter(l => !/wasm-function|@https?:/.test(l)).slice(0, 6).join('\n');
  step.textContent = why === noGraphics ? noGraphics : /webgl2 not available|Unable to find a GPU|Failed to create wgpu surface/.test(why) ? `${noGraphics}\n\n(${text})` : `The game stopped: ${text}`;
  // the whole error with the browser and its graphics for a report (Copy the error)
  document.getElementById('copy').hidden = false;
  document.getElementById('copy').onclick = e => {
    e.preventDefault();
    const gl = document.createElement('canvas').getContext('webgl2'), dbg = gl?.getExtension('WEBGL_debug_renderer_info');
    const gpu = gl ? gl.getParameter(dbg ? dbg.UNMASKED_RENDERER_WEBGL : gl.RENDERER) : 'no WebGL2';
    gl?.getExtension('WEBGL_lose_context')?.loseContext();
    const report = `${step.textContent}\n\n${lastError || msg}\n\n${navigator.userAgent}\nWebGL2: ${gpu}\n${location.href}`;
    navigator.clipboard?.writeText(report).then(() => e.target.textContent = 'Copied', () => e.target.textContent = 'Couldn\'t copy');
  };
}
// B378: Chromium with its GPU blocklisted, crashed or graphics acceleration off has no WebGL2 for the page (it no
// longer falls back to software WebGL by itself), and the renderer panicked deep inside ("Failed to create wgpu
// surface … webgl2 not available"): said in words, with what to change
const noGraphics = 'This browser isn\'t giving the page any 3D graphics (no WebGL2 or WebGPU), so the game can\'t start.\n'
  + 'Chrome / Chromium / Edge: Settings → System → turn on "Use graphics acceleration when available" and relaunch. '
  + 'Then open chrome://gpu: WebGL2 should say "Hardware accelerated". If it says disabled or blocklisted (common with '
  + 'Linux drivers), turn on chrome://flags/#ignore-gpu-blocklist and relaunch. Firefox: about:support → Graphics.';
// Bevy logs its errors with console.log (`%cERROR%c file:line%c message`, css args after) and quits on a render
// error (a lost GPU device…) without a panic: the page would sit on "Starting…" for good. The first error is the cause.
let renderError = '', shown = false;
const log = console.log;
console.log = (...a) => {
  log.apply(console, a);
  if (typeof a[0] !== 'string' || !a[0].startsWith('%cERROR')) return;
  const m = a[0].replace(/%c/g, '').replace(/^ERROR \S+ /, '');
  renderError ||= m;
  if (!m.includes('Quitting the application')) return;
  // WebGPU that fails before the first frame (B109): the WebGL2 build instead
  if (!shown && window.hstWebGL2?.()) return;

  // can't be rebuilt in place: start again, unless that already happened in the last minute
  if (/DeviceLost/.test(renderError)) {

    try { last = +sessionStorage.getItem('hstLost') || 0; sessionStorage.setItem('hstLost', Date.now()); } catch {}

// B223: a shader module the browser can't make (seen once on iOS Safari with a mod installed: "createShaderModule:
// unable to make shader module") is caught here: its label, the browser's messages and its WGSL go to the console for
// a repeat, and the page starts again with the WebGL2 build (the same shaders as GLSL); already on it, the game stops
// saying which shader it was.
if (window.GPUDevice) {
  const make = GPUDevice.prototype.createShaderModule, scopes = ['validation', 'internal', 'out-of-memory'];
  GPUDevice.prototype.createShaderModule = function (d) {
    for (const s of scopes) this.pushErrorScope(s);
    const m = make.call(this, d);
    Promise.all(scopes.map(() => this.popErrorScope())).then(async errs => {
      const e = errs.find(Boolean);
      if (!e) return;
      const info = await m.getCompilationInfo?.().catch(() => null);
      const lines = info?.messages.map(x => `${x.type} ${x.lineNum}:${x.linePos} ${x.message}`).join('\n') ?? '';
      console.warn(`hst: shader module "${d.label ?? ''}" failed: ${e.message}\n${lines}\n${d.code}`);
      if (window.hstWebGL2?.()) return;

// B330: a script from another origin that throws reaches the page as a bare "Script error." (no error, no file): the
// browser's own or an extension's, never the game's (every script of ours is same-origin). iOS Safari's Share button
// runs its share extensions' page scripts, and one throwing stopped the game on the ISO prompt: logged, not fatal.
addEventListener('error', e => {
  if (!e.error && !e.filename && /^script error\.?$/i.test(e.message ?? '')) return console.warn(`hst: ignored a script error from another origin (${e.message})`);

addEventListener('unhandledrejection', e => fail(e.reason));
// B260: a hidden tab gets no animation frames and the game's loop (Bevy on winit) only steps on them, so while the
// tab is hidden and no match is on (`web.rs` sets hstMatch), a frame comes from a timer instead (the browser throttles
// it to about one a second): store downloads and their queue, the lobby and its keep-alives go on. A match holds
// while hidden (the others see "Waiting for …", `play/recover.rs`).
{
  const raf = requestAnimationFrame.bind(window), caf = cancelAnimationFrame.bind(window);

  window.requestAnimationFrame = f => document.hidden && !window.hstMatch ? -setTimeout(() => f(performance.now()), 100) : raf(f);
  window.cancelAnimationFrame = id => id < 0 ? clearTimeout(-id) : caf(id);
}
// web.rs: the game's first frames are on screen
window.hstShown = () => { shown = true; clearTimeout(stuck); if (!boot.classList.contains('err')) boot.hidden = true; };
// B108: the screen never dims or locks while the game is open (a pad never touches it, touch play pauses between
// taps). The browser drops the lock when the tab is hidden: take it again on return; some (Safari) only grant it
// after a tap or key, so those try again too. No API (older browsers): the device's own sleep applies.
let wake = null;
const awake = () => {
  if (wake || document.visibilityState !== 'visible' || !navigator.wakeLock) return;
  wake = navigator.wakeLock.request('screen').then(l => l.addEventListener('release', () => wake = null), () => wake = null);
};
awake();
document.addEventListener('visibilitychange', awake);
for (const e of ['pointerdown', 'keydown', 'gamepadconnected']) addEventListener(e, awake);
</script>
<script type="module" src="touch.js"></script>
<script type="module">
if (answer) await new Promise(() => {});
// installable and playable offline (sw.js)
navigator.serviceWorker?.register('sw.js').catch(() => {});
// B317: a new build pushed while the page is open never reloads it: `version.txt` (the commit, tools/web.sh) as the
// page loads, read again every 10 minutes and on coming back to the tab; once it differs, `hstLatest` holds the new
// one and the game's main menu shows a New version card whose Refresh reloads into it (`update.rs`, sw.js fetches
// the network first). Read before the game, so a deploy landing mid-load at worst offers a refresh into the same build.
{
  const read = () => fetch('version.txt', { cache: 'no-store' }).then(r => r.ok ? r.text() : '').then(t => t.trim(), () => '');
  const loaded = await read();
  const check = async () => {
    const now = await read();
    if (loaded && now && now !== loaded && /^[0-9a-f]{7,40}$/.test(now)) window.hstLatest = now;
  };

}
// First visit: the worker imports the picked ISO into OPFS `disc.pack`. Every visit after: read the pack, `run` it.
// `?forget` drops the imported pack (pick the ISO again). WebGPU build when the browser has an adapter, else WebGL2
// (`?webgl2` forces it), or Settings → Display → Renderer (B273: `renderer` in settings.txt, which the game keeps in
// localStorage, web.rs): WebGL2, or WebGPU (no WebGL2 retry when it fails; the error's Try WebGL2 link still is).
// Gecko (Firefox, Zen) gets WebGL2 unless the setting says WebGPU (B298): its WebGPU (Windows, D3D12) draws skinned
// and indexed meshes broken (exploded skinning, holes in the court) and WebGL2 draws them right.
say('Checking graphics…');

// the median of 40 frame gaps, snapped to a usual rate within 3 %. Settings (WebGL2 build) holds the game's best
// second against it to say whether WebGL2 is capped on this device (`hstRefresh`, web.rs)
{
  const gaps = [];
  let last;

    if (last !== undefined) gaps.push(t - last);
    last = t;
    if (gaps.length < 40) return requestAnimationFrame(tick);

const status = document.getElementById('status');
const q = new URLSearchParams(location.search);
if (q.has('forget')) {

  location.search = q.toString();

// the game's wasm, with how much of it has arrived
async function wasm() {
  const r = await fetch(pkg + 'hst_bg.wasm');
  if (!r.ok) throw new Error(`${pkg}hst_bg.wasm: HTTP ${r.status}`);
  let got = 0;
  const count = new TransformStream({ transform(c, out) {
    got += c.byteLength;
    say(`Downloading the game… ${(got / 1e6).toFixed(0)} MB`);
    out.enqueue(c);

  return new Response(r.body.pipeThrough(count), { headers: { 'Content-Type': 'application/wasm' } });

// B358: `data` (bytes or text) into OPFS at `path` ('a/b/c', folders made as needed). Safari before 26 (iOS 18) has
// no createWritable on the page ("createWritable is not a function"): its writes go through a worker's sync access
// handle (opfs.js), one file a message
let writer;
const writes = new Map();
let writeId = 0;
const writeFile = async (path, data) => {
  if (data === undefined) throw new Error(`nothing to write for ${path}`);
  const parts = path.split('/');
  if ('createWritable' in FileSystemFileHandle.prototype) {
    let d = dir;
    for (const s of parts.slice(0, -1)) d = await d.getDirectoryHandle(s, { create: true });
    const w = await (await d.getFileHandle(parts.at(-1), { create: true })).createWritable();
    await w.write(data);
    await w.close();
    return;

  if (!writer) {
    writer = new Worker('./opfs.js');
    writer.onmessage = ({ data: { id, error } }) => {
      const p = writes.get(id);
      writes.delete(id);
      error ? p.reject(new Error(error)) : p.resolve();

      for (const p of writes.values()) p.reject(new Error(`OPFS writer: ${e.message ?? e}`));

  const id = writeId++;
  return new Promise((resolve, reject) => {
    writes.set(id, { resolve, reject });
    writer.postMessage({ id, path, bytes }, [bytes.buffer]);
  });

async function start() {

  for await (const [name, h] of cards.entries()) if (h.kind === 'file') add_card(name, new Uint8Array(await (await h.getFile()).arrayBuffer()));
  window.hstCard = (name, bytes) => writeFile(`previews/${name}`, bytes).catch(e => console.warn(`hst: card ${name}: ${e}`));
  window.hstCardDrop = name => cards.removeEntry(name).catch(() => {});
  // a file for the player (web.rs save_file: a desync's report): kept in OPFS reports/ and downloaded
  window.hstSaveFile = (name, text) => {
    writeFile(`reports/${name}`, text).catch(e => console.warn(`hst: ${name}: ${e}`));
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([text], { type: 'application/json' })), download: name });
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  };
  // M16: installed mods (OPFS mods/<id>/…) into the game, a folder without its mod.json (a save cut short) dropped
  const mods = await dir.getDirectoryHandle('mods', { create: true });
  const modsFrom = performance.now();
  let modBytes = 0;
  const walk = async (d, path, out) => { for await (const [n, h] of d.entries()) h.kind === 'file' ? out.push([path + n, h]) : await walk(h, `${path}${n}/`, out); return out; };
  for await (const [id, h] of mods.entries()) {
    if (h.kind !== 'directory') continue;
    // B227: an older install's upscaled set (modfs.rs kept_in_memory: never read in the browser) freed from storage
    await h.getDirectoryHandle('textures').then(t => t.removeEntry('upscaled', { recursive: true })).catch(() => {});
    const files = await walk(h, `mods/${id}/`, []);
    if (!files.some(f => f[0] === `mods/${id}/mod.json`)) { await mods.removeEntry(id, { recursive: true }).catch(() => {}); continue; }
    say(`Reading mod ${id}…`);
    // B336: only the manifests and select pictures now (modfs.rs small); models, textures and voices when the game wants the mod (hstModLoad)
    for (const [p, fh] of files) {
      const f = await fh.getFile();
      if (!p.endsWith('.json') && !p.includes('/previews/')) { add_mod_lazy(p, f.size); continue; }
      const b = new Uint8Array(await f.arrayBuffer());
      modBytes += b.length;
      add_mod_file(p, b);
    }
  }
  // a mod folder (`mods/<id>`) in from OPFS, a file at a time (modfs.rs ready); a file that fails is left out
  window.hstModLoad = async dir => {
    const from = performance.now();
    let n = 0;
    try {
      let d = mods;
      for (const s of dir.split('/').slice(1)) d = await d.getDirectoryHandle(s);
      for (const [p, fh] of await walk(d, `${dir}/`, [])) {
        if (p.endsWith('.json') || p.includes('/previews/')) continue;
        try { const b = new Uint8Array(await (await fh.getFile()).arrayBuffer()); n += b.length; add_mod_file(p, b); }
        catch (e) { console.warn(`hst: ${p}: ${e}`); }
      }
    } catch (e) { console.warn(`hst: reading ${dir}: ${e}`); }
    console.info(`hst: ${dir} read in (${(n / 1048576).toFixed(1)} MB) in ${Math.round(performance.now() - from)} ms`);
    mod_loaded(dir);
  };
  console.info(`hst: mods read from OPFS (${(modBytes / 1048576).toFixed(1)} MB) in ${Math.round(performance.now() - modsFrom)} ms`);
  // the Mods screen's picker (web.rs): over the Add mod row while it's up, or opened by a key or pad
  const pick = document.getElementById('modzip');
  window.hstModPicker = r => { pick.hidden = !r; if (r) Object.assign(pick.style, { left: `${r[0]}%`, top: `calc(var(--safe-top) + ${r[1] / 100} * (var(--app-h, 100dvh) - var(--safe-top)))`, width: `${r[2]}%`, height: `calc(${r[3] / 100} * (var(--app-h, 100dvh) - var(--safe-top)))` }); };
  window.hstModPick = () => pick.click();
  // B338: the OPFS writes and removals under way; Reload (web.rs reload) waits for them, a save cut short by the
  // reload is a folder without its mod.json, dropped at the next start (the mod "didn't come in")
  const pending = new Set();
  const track = p => { pending.add(p); p.finally(() => pending.delete(p)).catch(() => {}); return p; };
  window.hstReload = async () => {
    const until = Date.now() + 120000;
    if (pending.size) { boot.hidden = false; say('Saving mods before reloading…'); }
    while (pending.size && Date.now() < until) await Promise.race([Promise.allSettled([...pending]), new Promise(r => setTimeout(r, until - Date.now()))]);
    location.reload();
  };
  window.hstModDrop = id => track(mods.removeEntry(id, { recursive: true }).catch(e => console.warn(`hst: removing mod ${id}: ${e}`)));
  pick.onchange = async () => {
    const f = pick.files[0];
    pick.value = '';
    if (!f) return;
    mod_status(`Checking ${f.name}...`);
    // read from the file a part at a time, never whole (B204)
    let m;
    try { m = await import_mod(f); } catch (e) { mod_status(`Couldn't add ${f.name}: ${e}`); return; }
    await window.hstModSave(m.id, m.name);
  };
  // B227: the store reads a download's parts straight from it (modstore.rs ranged); B204's whole zip is gone
  dir.removeEntry('mod-download.zip').catch(() => {});
  // an installed mod (a picked zip, or one the mod store downloaded, M17) from the game into OPFS mods/<id>/
  const save = async (id, name) => {
    mod_status(`Saving ${name}...`);
    try {
      await mods.removeEntry(id, { recursive: true }).catch(() => {});
      await mods.getDirectoryHandle(id, { create: true });
      const put = ([p, bytes]) => writeFile(`mods/${id}/${p}`, bytes);
      // eight at a time (a write is slow on its own; all at once held the whole mod twice, B204), mod.json
      // (mod_paths' last) after the rest is in
      const paths = mod_paths(id), json = paths.pop();
      const one = p => put([p, mod_file(id, p)]);
      const next = async () => { for (let p; (p = paths.shift()) !== undefined;) await one(p); };
      await Promise.all(Array.from({ length: 8 }, next));
      await one(json);
      mod_saved(id);
      mod_status(`Added ${name}. Reload to play it.`);
    } catch (e) {
      await mods.removeEntry(id, { recursive: true }).catch(() => {});
      drop_mod(id);
      mod_status(`Couldn't save ${name} in this browser's storage: ${e}`);
    }
  };
  window.hstModSave = (id, name) => track(save(id, name));
  // Join by Code takes the last text pasted on the page
  addEventListener('paste', e => paste(e.clipboardData.getData('text')));
  // Join by Code's code entry on a phone (web.rs code_entry): the input over the canvas takes the taps, its keys go
  // to the game one at a time (a space kept in it so Backspace always fires)
  const keys = document.getElementById('codekeys');
  window.hstCodeEntry = (on, url) => { keys.autocapitalize = url ? 'none' : 'characters'; keys.inputMode = url ? 'url' : 'text'; keys.hidden = !(on && (window.hstTouched?.() ?? matchMedia('(pointer: coarse)').matches)); keys.value = ' '; if (keys.hidden) keys.blur(); };
  // B207: Return / Go finishes the entry (as Save / Join) and closes the keyboard
  keys.onkeydown = e => { if (e.key === 'Enter' || e.keyCode === 13) { e.preventDefault(); typed_code('\n'); keys.blur(); } };
  keys.oninput = e => { typed_code(e.inputType?.startsWith('delete') ? '\b' : (e.data ?? keys.value.trim())); keys.value = ' '; };
  // a LAN answer from a tab opened by scanning a guest's code
  new BroadcastChannel('hst-rtc').onmessage = e => paste(String(e.data));
  try {
    run(bytes);
  } catch (e) {
    // winit hands the event loop to the browser by throwing
    if (!String(e).includes('Using exceptions for control flow')) throw e;
  }
}

try {
  await start();
} catch (e) {
  if (e.name !== 'NotFoundError') throw e;
  clearTimeout(stuck);
  boot.hidden = true;
  document.getElementById('disc').hidden = false;
  document.getElementById('iso').onchange = ev => {
    const file = ev.target.files[0];
    if (!file) return;
    status.textContent = 'Importing…';
    const w = new Worker('./worker.js', { type: 'module' });
    w.onmessage = async ({ data }) => {
      if (data.progress) status.textContent = `Importing… ${Math.floor(100 * data.progress[0] / data.progress[1])}%`;
      else if (data.error) status.textContent = `Couldn't import ${file.name}: ${data.error}`;
      else if (data.hash) {
        status.textContent = 'Imported. The ISO is no longer needed; you can delete it.';
        w.terminate();
        await start();
      }
    };
    w.postMessage(file);
  };
}
</script>
</body>
</html>
