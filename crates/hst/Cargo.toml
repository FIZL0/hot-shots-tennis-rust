[package]
name = "hst"
version = "0.1.0"
edition = "2024"

[dependencies]
# rollback (M2h, `play/rollback.rs`): ggrs core, its messages as bincode in iroh datagrams
ggrs = { version = "0.13", features = ["sync-send"] }
bincode = "1.3"
hst-data = { path = "../hst-data" }
hst-sim = { path = "../hst-sim" }
# `debug`: type names, which `mode.rs` tells its resources by
bevy = { version = "0.19.1", features = ["debug"] }
gltf = { version = "1.4", default-features = false, features = ["extras", "names", "utils"] }
serde_json = "1"
# `SystemTime` that also works in the browser (std's panics on wasm32-unknown-unknown)
web-time = "1"
serde = { version = "1", features = ["derive"] }
# the select cards' PNG encode (`play/main_menu/previews.rs`; bevy's own image crate)
image = { version = "0.25", default-features = false, features = ["png"] }
# join codes as QR (`play/main_menu/online.rs`)
qrcode = { version = "0.14", default-features = false }
# the menus' remastered art (`play/menu_art.rs`): vector labels from an OFL font (both already in the lock via bevy)
tiny-skia = { version = "0.11", default-features = false, features = ["std"] }
ab_glyph = "0.2"
# netplay transport (`net.rs`): iroh QUIC (relay-only in the browser), tickets for codes/QR; tasks and timers through
# n0-future (tokio natively, the browser's event loop on wasm)
iroh = "1.3"
iroh-tickets = "1"
n0-future = "0.3"
tokio = { version = "1", features = ["macros", "sync"] }
# the browser's LAN codes (M2k, `net/rtc.rs`)
data-encoding = "2"
# short lobby codes through a pkarr relay (`net.rs`; iroh already builds it: rustls natively, fetch in the browser)
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
# mod zips (M16, `modfs.rs`): deflate, already built for png
miniz_oxide = "0.8"
# the mod store's download check (M17, `modstore.rs`; already built for iroh)
sha2 = "0.11"

# copy/paste of join codes through the OS clipboard (arboard: none on iOS, where it stays in-app)
[target.'cfg(not(target_os = "ios"))'.dependencies]
bevy = { version = "0.19.1", features = ["system_clipboard"] }

# iOS: stderr into the app's log file (`ios.rs`)
[target.'cfg(target_os = "ios")'.dependencies]
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
ggrs = { version = "0.13", features = ["wasm-bindgen"] }
web-sys = { version = "0.3", features = ["Blob", "Document", "DomRect", "Element", "File", "FileReaderSync", "FileSystemSyncAccessHandle", "FileSystemReadWriteOptions", "Location", "Storage", "UrlSearchParams", "Window", "MessageEvent", "RtcPeerConnection", "RtcPeerConnectionState", "RtcDataChannel", "RtcDataChannelInit", "RtcDataChannelState", "RtcDataChannelType", "RtcSessionDescription", "RtcSessionDescriptionInit", "RtcSdpType", "RtcIceGatheringState"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# the window icon (`main.rs` window_icon), on bevy's own winit
winit = { version = "0.30", default-features = false }
# lobbies: addresses and lobby list on the mainline DHT and LAN mDNS (UDP: not in the browser)
iroh-mainline-address-lookup = "0.6"
n0-mainline = "0.7"
# the crypto reqwest uses for the pkarr relay (`net.rs` relay_put): iroh's own ring
rustls = { version = "0.23", default-features = false, features = ["ring"] }
iroh-mdns-address-lookup = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }


[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios")))'.dependencies]
# Add mod's file picker on desktop (the xdg portal on Linux; the browser build uses the page's input, iOS the Files app)
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[features]
# the browser build on WebGPU (`tools/web.sh` builds it beside the default WebGL2 one; the page picks)
webgpu = ["bevy/webgpu"]
