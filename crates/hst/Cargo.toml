[package]
name = "hst"
version = "0.1.0"
edition = "2024"

[dependencies]
# rollback (M2h, `play/rollback.rs`): ggrs core, its messages as bincode in iroh datagrams
ggrs = { version = "0.13", features = ["sync-send"] }
bincode = "1.3"
hst-data = { path = "../hst-data" }
hst-sim = { path = "../hst-sim" }
# `debug`: type names, which `mode.rs` tells its resources by
bevy = { version = "0.19.1", features = ["debug", "system_clipboard"] }
gltf = { version = "1.4", default-features = false, features = ["extras", "names", "utils"] }
serde_json = "1"
# `SystemTime` that also works in the browser (std's panics on wasm32-unknown-unknown)
web-time = "1"
serde = { version = "1", features = ["derive"] }
# join codes as QR (`play/main_menu/online.rs`)
qrcode = { version = "0.14", default-features = false }
# netplay transport (`net.rs`): iroh QUIC (relay-only in the browser), tickets for codes/QR; tasks and timers through
# n0-future (tokio natively, the browser's event loop on wasm)
iroh = "1.3"
iroh-tickets = "1"
n0-future = "0.3"
tokio = { version = "1", features = ["macros", "sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
ggrs = { version = "0.13", features = ["wasm-bindgen"] }
web-sys = { version = "0.3", features = ["Blob", "File", "FileReaderSync", "FileSystemSyncAccessHandle", "FileSystemReadWriteOptions", "Location", "Storage", "UrlSearchParams", "Window"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# lobbies: addresses and lobby list on the mainline DHT and LAN mDNS (UDP: not in the browser)
iroh-mainline-address-lookup = "0.6"
n0-mainline = "0.7"
iroh-mdns-address-lookup = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[features]
# the browser build on WebGPU (`tools/web.sh` builds it beside the default WebGL2 one; the page picks)
webgpu = ["bevy/webgpu"]
