[package]
name = "hst-sim"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
hst-data = { path = "../hst-data" }
# the PS2 arithmetic (EE FPU, VU0), C library maths and random generators the game links: our own crate
ps2-float = { git = "https://github.com/FIZL0/ps2-float", tag = "v0.3.0", features = ["serde"] }

# musl's libm in pure Rust: the same transcendental results on every target (std's come from each platform's libm)
musl = { package = "libm", version = "0.2.16" }
# the online resync's state transfer (hst `play/snapshot.rs`)
serde = { version = "1", features = ["derive"] }

[lints.clippy]
# ported compares keep the original's branch: `!(a < b)` is the EE's c.lt.s + bc1f, taken for NaN too, which
# `a >= b` isn't; spelling every one as `partial_cmp` hides which way the game branched
neg_cmp_op_on_partial_ord = "allow"
