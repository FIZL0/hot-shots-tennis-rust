# B528: pkarr.opentennis.dev → the relay on the TrueNAS box. Point DNS at nginx, get a cert (certbot/NPM),
# change 192.168.1.10 to the TrueNAS address. The relay sends its own CORS headers; don't add or strip any.
server {
    listen 443 ssl;
    http2 on;
    server_name pkarr.opentennis.dev;
    ssl_certificate     /etc/letsencrypt/live/pkarr.opentennis.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pkarr.opentennis.dev/privkey.pem;

    location / {
        proxy_pass http://192.168.1.10:6881;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;   # a PUT waits for the relay's DHT put
        client_max_body_size 4k;  # a signed packet is ≤ 1104 bytes
    }
}
server {
    listen 80;
    server_name pkarr.opentennis.dev;
    return 301 https://$host$request_uri;
}
