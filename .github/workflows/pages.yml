# The browser build (`tools/web.sh`) on GitHub Pages: the page and the wasm only, no game data (players pick their ISO).
# Each run also replaces the rolling "Latest alpha" release (tag `alpha`, marked latest) with Linux + Windows builds of
# the same commit, as tools/build.sh makes them. tools/ship-local.sh builds the website on the dev machine and runs this
# with `prebuilt`: that run only deploys the uploaded web/ (the build jobs are skipped).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prebuilt:
        description: deploy the web/ that tools/ship-local.sh uploaded (release web-prebuilt) instead of building
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
# a running deploy always finishes (builds take ~20 min, merges come faster); GitHub keeps only the newest queued one
# tools/ship-local.sh's prebuilt deploys have their own group, so they don't wait behind a build
concurrency:
  group: pages${{ inputs.prebuilt && '-prebuilt' || '' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - if: ${{ inputs.prebuilt }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: mkdir web && gh release download web-prebuilt -R "${{ github.repository }}" -p web.tar.gz -O - | tar xz -C web
      - if: ${{ !inputs.prebuilt }}
        uses: actions/checkout@v4
      - if: ${{ !inputs.prebuilt }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - if: ${{ !inputs.prebuilt }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target-wasm"  # tools/web.sh builds there, not in target/
      - if: ${{ !inputs.prebuilt }}
        name: Tools
        run: |
          cargo install wasm-bindgen-cli --locked --version "$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')"
          # Ubuntu's binaryen is too old for rustc's wasm features
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_123/bin" >> "$GITHUB_PATH"
      - if: ${{ !inputs.prebuilt }}
        run: tools/web.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # a stale run doesn't put an older site back over a newer one (e.g. one tools/ship-local.sh deployed)
      - id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" -q .sha)" = "$GITHUB_SHA" ] && echo ok=1 >> "$GITHUB_OUTPUT" || echo "main moved on, skipping"
      - if: ${{ steps.fresh.outputs.ok }}
        id: deployment
        uses: actions/deploy-pages@v4
  # executables are only built by Actions: tools/ship-local.sh ships the website alone
  linux:
    if: ${{ !inputs.prebuilt }}
    runs-on: ubuntu-latest
    # Steam Runtime sniper (glibc 2.31) like tools/build.sh, so it runs on every SteamOS / Steam Deck
    container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo build --release -p hst
          mkdir -p dist/linux
          strip -o dist/linux/hst target/release/hst
          cp crates/hst/icon/hst.png dist/linux/hst.png
          printf '[Desktop Entry]\nType=Application\nName=Hot Shots Tennis\nExec=hst\nIcon=hst\nStartupWMClass=hst\nCategories=Game;\n' > dist/linux/hst.desktop
          tar -czf hst-linux-x86_64.tar.gz -C dist/linux .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: hst-linux-x86_64.tar.gz
  windows:
    if: ${{ !inputs.prebuilt }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update -q && sudo apt-get install -yq gcc-mingw-w64-x86-64
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc RUSTFLAGS="-C target-feature=+crt-static" \
            cargo build --release -p hst --target x86_64-pc-windows-gnu
          x86_64-w64-mingw32-strip -o hst.exe target/x86_64-pc-windows-gnu/release/hst.exe
          zip -q hst-windows-x86_64.zip hst.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: hst-windows-x86_64.zip
  alpha:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # a stale run leaves it to the newer one: tagging a commit whose workflow files differ from main's is a
          # workflow change, which github.token may not make (HTTP 403), and the delete below would leave no release
          [ "$(gh api "repos/$GH_REPO/commits/main" -q .sha)" = "$GITHUB_SHA" ] || { echo "main moved on, skipping"; exit 0; }
          # recreated each time so the tag moves to this commit; the download links stay the same
          gh release delete alpha --cleanup-tag -y || true
          printf '%s\n\n%s\n\n%s\n' "**Rolling alpha: rebuilt on every change to main (${GITHUB_SHA::7}). Expect bugs.**" \
            "No game data is included: you need your own *Hot Shots Tennis (USA)* (SCUS-97610) ISO." \
            "Browser version: https://opentennis.dev/" > notes.md
          gh release create alpha --latest --target "$GITHUB_SHA" --title "Latest alpha (${GITHUB_SHA::7})" \
            --notes-file notes.md hst-linux-x86_64.tar.gz hst-windows-x86_64.zip
