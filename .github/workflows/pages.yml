# The browser build (`tools/web.sh`) on GitHub Pages: the page and the wasm only, no game data (players pick their ISO).
# Every push to main is a beta: it replaces the rolling "Beta" release (tag `beta`, a pre-release, never Latest) with
# Linux + Windows builds and the website (web.tar.gz) of that commit, then asks FIZL0/opentennis-beta (one workflow,
# tools/beta-site.yml) to put that website on https://beta.opentennis.dev (secret BETA_DISPATCH_TOKEN: a fine-grained
# token with Contents read/write on that repo; without it the beta site isn't updated).
# Which builds go on https://opentennis.dev is the repo variable SITE_FROM:
#   unset / main   every push to main (as before)
#   release        only published releases (tools/release.sh): `gh variable set SITE_FROM --body release`
# tools/ship-local.sh builds the website on the dev machine and runs this with `prebuilt`: that run only deploys the
# uploaded web/ (the build jobs are skipped) to opentennis.dev, or to the beta site when SITE_FROM is release.
name: pages
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      prebuilt:
        description: deploy the web/ that tools/ship-local.sh uploaded (release web-prebuilt) instead of building
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
# a running deploy always finishes (builds take ~20 min, merges come faster); GitHub keeps only the newest queued one
# tools/ship-local.sh's prebuilt deploys have their own group, so they don't wait behind a build
concurrency:
# releases have their own group too: a queued push run must not replace a queued release deploy
  group: pages-${{ github.event_name }}${{ inputs.prebuilt && '-prebuilt' || '' }}
  cancel-in-progress: false
jobs:
  build:
    # a release only builds the site when it is the one opentennis.dev shows
    if: ${{ github.event_name != 'release' || vars.SITE_FROM == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - if: ${{ inputs.prebuilt }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: mkdir web && gh release download web-prebuilt -R "${{ github.repository }}" -p web.tar.gz -O - | tar xz -C web
      - if: ${{ !inputs.prebuilt }}
        uses: actions/checkout@v4
      - if: ${{ !inputs.prebuilt }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - if: ${{ !inputs.prebuilt }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target-wasm"  # tools/web.sh builds there, not in target/
      - if: ${{ !inputs.prebuilt }}
        name: Tools
        run: |
          cargo install wasm-bindgen-cli --locked --version "$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')"
          # Ubuntu's binaryen is too old for rustc's wasm features
          curl -sL https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_123/bin" >> "$GITHUB_PATH"
      - if: ${{ !inputs.prebuilt }}
        run: tools/web.sh
        env:
          HST_SITE: ${{ github.event_name != 'release' && vars.SITE_FROM == 'release' && 'https://beta.opentennis.dev/' || '' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - run: tar -czf web.tar.gz -C web .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web.tar.gz
  deploy:
    needs: build
    if: ${{ (github.event_name == 'release') == (vars.SITE_FROM == 'release') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # a stale run doesn't put an older site back over a newer one (e.g. one tools/ship-local.sh deployed)
      - id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        # a release deploys its own tag, whatever main is at
        run: |
          [ "$GITHUB_EVENT_NAME" = release ] || [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" -q .sha)" = "$GITHUB_SHA" ] && echo ok=1 >> "$GITHUB_OUTPUT" || echo "main moved on, skipping"
      - if: ${{ steps.fresh.outputs.ok }}
        id: deployment
        uses: actions/deploy-pages@v4
  # executables are only built by Actions: tools/ship-local.sh ships the website alone
  # releases ship tools/release.sh's own builds
  linux:
    if: ${{ !inputs.prebuilt && github.event_name != 'release' }}
    runs-on: ubuntu-latest
    # Steam Runtime sniper (glibc 2.31) like tools/build.sh, so it runs on every SteamOS / Steam Deck
    container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - env:
          HST_SITE: ${{ vars.SITE_FROM == 'release' && 'https://beta.opentennis.dev/' || '' }}
        run: |
          cargo build --release -p hst --features ship
          mkdir -p dist/linux
          strip -o dist/linux/opentennis target/release/hst
          cp crates/hst/icon/hst.png dist/linux/opentennis.png
          printf '[Desktop Entry]\nType=Application\nName=OpenTennis\nExec=opentennis\nIcon=opentennis\nStartupWMClass=opentennis\nCategories=Game;\n' > dist/linux/opentennis.desktop
          tar -czf opentennis-linux-x86_64.tar.gz -C dist/linux .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: opentennis-linux-x86_64.tar.gz
  windows:
    if: ${{ !inputs.prebuilt && github.event_name != 'release' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update -q && sudo apt-get install -yq gcc-mingw-w64-x86-64
          export HST_SITE=${{ vars.SITE_FROM == 'release' && 'https://beta.opentennis.dev/' || '' }}
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc RUSTFLAGS="-C target-feature=+crt-static" \
            cargo build --release -p hst --features ship --target x86_64-pc-windows-gnu
          x86_64-w64-mingw32-strip -o opentennis.exe target/x86_64-pc-windows-gnu/release/hst.exe
          zip -q opentennis-windows-x86_64.zip opentennis.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: opentennis-windows-x86_64.zip
  # a prebuilt run has only the website: it updates the beta site, not the release, and only when opentennis.dev
  # doesn't already show it
  beta:
    needs: [build, linux, windows]
    if: ${{ !cancelled() && github.event_name != 'release' && needs.build.result == 'success' && (inputs.prebuilt && vars.SITE_FROM == 'release' || !inputs.prebuilt && needs.linux.result == 'success' && needs.windows.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DISPATCH: ${{ secrets.BETA_DISPATCH_TOKEN }}
          PREBUILT: ${{ inputs.prebuilt }}
        run: |
          # tagging a commit whose workflow files differ from main's is a workflow change, which github.token may not
          # make (HTTP 403), and the delete below would leave no release: leave that to the newer run. Otherwise a
          # stale run still publishes (skipping whenever main had moved on starved beta while merges kept landing),
          # unless the beta already shows a newer commit.
          wf=$(gh api "repos/$GH_REPO/compare/$GITHUB_SHA...main" -q '[.files[].filename|select(startswith(".github/workflows/"))]|length')
          [ "$wf" = 0 ] || { echo "workflow files changed on main since, skipping"; exit 0; }
          cur=$(gh api "repos/$GH_REPO/commits/beta" -q .sha 2>/dev/null || true)
          if [ -n "$cur" ] && [ "$(gh api "repos/$GH_REPO/compare/$cur...$GITHUB_SHA" -q .status)" = behind ]; then
            echo "beta already at newer ${cur::7}, skipping"; exit 0
          fi
          if [ "$PREBUILT" = true ]; then
            gh release upload beta --clobber web.tar.gz
          else
            # recreated each time so the tag moves to this commit; the download links stay the same
            gh release delete beta --cleanup-tag -y || true
            printf '%s\n\n%s\n\n%s\n' \
              "**Beta: rebuilt on every change to main (${GITHUB_SHA::7}). Newer than the latest release, less tested.** For the stable version, see [the latest release](https://github.com/$GH_REPO/releases/latest)." \
              "No game data is included: you need your own *Hot Shots Tennis (USA)* (SCUS-97610) ISO." \
              "Beta in the browser: https://beta.opentennis.dev/" > notes.md
            gh release create beta --prerelease --latest=false --target "$GITHUB_SHA" --title "Beta (${GITHUB_SHA::7})" \
              --notes-file notes.md opentennis-linux-x86_64.tar.gz opentennis-windows-x86_64.zip web.tar.gz
          fi
          if [ -n "$DISPATCH" ]; then
            GH_TOKEN=$DISPATCH gh api repos/FIZL0/opentennis-beta/dispatches -f event_type=beta
          else
            echo "::warning::no BETA_DISPATCH_TOKEN secret: beta.opentennis.dev not updated"
          fi
