[workspace]
resolver = "2"
members = ["crates/*"]

[profile.dev]
debug = "line-tables-only"  # panics keep file:line; full debug info made every build and link of the game slower
split-debuginfo = "unpacked"  # P59: debug info stays in the .o/.dwo files, not re-linked into every test binary
[profile.dev.package."*"]
debug = false  # P59: dependencies without line tables: hst's test binary 772 → 205 MB, links ~35% faster
opt-level = 3
# tests play whole matches: optimised game crates run them 3-4x faster for about the same rebuild time
# (f32 results don't depend on opt-level: no fast-math in Rust)
[profile.dev.package.hst-sim]
opt-level = 3
[profile.dev.package.hst-data]
opt-level = 3
# the oracle interprets the game's code: unoptimised, a 10k-input MT19937 check takes 40 s instead of 4
[profile.dev.package.hst-oracle]
opt-level = 3
[profile.dev.package.ps2-oracle]
opt-level = 3
debug = "line-tables-only"  # ours (git dependency): keeps file:line past the "*" above
[profile.dev.package.ps2-float]
opt-level = 3
debug = "line-tables-only"  # ours (git dependency): keeps file:line past the "*" above
[profile.dev.package.hst]
opt-level = 1

# gilrs-core with a read-only fallback for gamepads whose device node isn't writable (third_party/gilrs-core).
[patch.crates-io]
gilrs-core = { path = "third_party/gilrs-core" }
# B328: WebGPU device limits/features read once instead of from the browser on every draw (src/backend/webgpu.rs)
wgpu = { path = "third_party/wgpu" }
# B385: on CPU batching (WebGL2) an unbatchable mesh with no batch data this frame keeps its slot and is skipped, instead of
# shifting the dynamic offsets and indexing past their end (render_phase/mod.rs, batching/no_gpu_preprocessing.rs)
# P36: a retained bin's GPU buffers are uploaded only when they changed, not per view × batch set every frame
# (render_phase/mod.rs `dirty`, batching/gpu_preprocessing.rs write_binned_instance_buffers)
# P47: where pipelines compile on the render thread (browser, macOS), a queue pass stops after a time budget
# (render_resource/pipeline_cache.rs `compile_budget`, set by hst's mode.rs)
bevy_render = { path = "third_party/bevy_render" }
# P37: the mesh-preprocess bind groups kept while their buffers stay the same, instead of rebuilt for every view and
# phase each frame (src/render/gpu_preprocess.rs); B468: CPU clustering reuses each view's cluster buffers instead of
# making new ones every frame, which WebGPU never frees until GC (src/cluster/mod.rs)
bevy_pbr = { path = "third_party/bevy_pbr" }
# M91: iOS 27 requires the UIScene lifecycle; winit 0.30 puts its windows in the app's scene (src/platform_impl/ios/window.rs)
# M101: Android pad key/motion events go to a queue (platform::android::gamepad) for `hst/src/android_pad.rs`, not into Touch/KeyboardInput
winit = { path = "third_party/winit" }
